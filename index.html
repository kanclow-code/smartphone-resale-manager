<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>輸入スマホ転売管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#111827;color:white;padding:22px 18px}
header h2{margin:0 0 6px}
main{padding:16px;max-width:650px;margin:auto}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
label{font-size:13px;font-weight:bold}
button{background:#2563eb;color:white;border:0;border-radius:9px;padding:13px;width:100%;font-size:15px;font-weight:bold}
.stat{font-size:25px;font-weight:bold;color:#2563eb}
.item{border-bottom:1px solid #e2e8f0;padding:12px 0}
.small{color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>
<h2>📱 輸入スマホ転売管理</h2>
<div>仕入れ・販売・利益をまとめて管理</div>
</header>
<main>
<div class="card">
<h3>📊 売上・利益サマリー</h3>
<div>販売台数：<span id="count" class="stat">0</span> 台</div>
<div>累計利益：<span id="profit" class="stat">¥0</span></div>
</div>
<div class="card">
<h3>＋ 商品を登録</h3>
<label>商品名</label>
<input id="name" placeholder="例：Xiaomi 18 Pro Max">
<label>仕入れ価格（円）</label>
<input id="cost" type="number" placeholder="例：100000">
<label>送料・関税など（円）</label>
<input id="extra" type="number" placeholder="例：5000">
<label>販売予定価格（円）</label>
<input id="price" type="number" placeholder="例：135000">
<label>販売先</label>
<select id="site">
<option>メルカリ</option>
<option>PayPayフリマ</option>
<option>ヤフオク</option>
<option>楽天ラクマ</option>
</select>
<button onclick="addItem()">商品を登録する</button>
</div>
<div class="card">
<h3>📦 商品一覧</h3>
<div id="items">登録商品はありません</div>
</div>
</main>
<script>
let products=JSON.parse(localStorage.getItem('products')||'[]');
function yen(n){return '¥'+Number(n).toLocaleString('ja-JP')}
function render(){
document.getElementById('count').textContent=products.filter(p=>p.sold).length;
document.getElementById('profit').textContent=yen(products.filter(p=>p.sold).reduce((s,p)=>s+p.profit,0));
document.getElementById('items').innerHTML=products.length?products.map((p,i)=>`
<div class="item">
<strong>${p.name}</strong><br>
<span class="small">${p.site}・${p.sold?'販売済み':'出品前'}</span>
<p>仕入れ総額：${yen(p.cost+p.extra)}<br>販売予定：${yen(p.price)}<br>予定利益：${yen(p.price-p.cost-p.extra)}</p>
<button onclick="sell(${i})">${p.sold?'販売済み':'販売完了にする'}</button>
</div>`).join(''):'登録商品はありません';
}
function addItem(){
let name=document.getElementById('name').value.trim();
let cost=Number(document.getElementById('cost').value);
let extra=Number(document.getElementById('extra').value);
let price=Number(document.getElementById('price').value);
if(!name||cost<=0||price<=0){alert('商品名・仕入れ価格・販売予定価格を入力してください');return}
products.push({name,cost,extra,price,site:document.getElementById('site').value,sold:false,profit:0});
save();
['name','cost','extra','price'].forEach(id=>document.getElementById(id).value='');
}
function sell(i){
let p=products[i];
if(p.sold)return;
p.profit=p.price-p.cost-p.extra;
p.sold=true;
save();
}
function save(){
localStorage.setItem('products',JSON.stringify(products));
render();
}
render();
</script>
</body>
</html>
